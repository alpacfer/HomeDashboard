<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100" preserveAspectRatio="none">
  <!-- Cirrus uncinus: ice blown off a falling streak, so every one of them is a
       dense little head with a long tail combed the same way by the same wind.
       Nine of them, none the same length, none at the same height, and the tails
       all lean one way — that shear is the whole reason a cirrus sky reads as
       high rather than near. Drawn as pointed lenses because a lens tapers to
       nothing at both ends on its own, which is what a fibre does; a stroke with
       round caps would have given every streak the same blunt end.
       The two at the edges are one streak, drawn twice 320 apart, so repeat-x
       has no seam. -->
  <defs>
    <linearGradient id="cir-fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".62" stop-color="#fff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="url(#cir-fade)">
    <!-- head, then tail. The head is a separate blob at higher opacity so the
         hook the genus is named for actually shows at 320 px wide. -->
    <g opacity=".85">
      <path d="M22 21q9-6 17-3 5 2 3 6-3 5-12 5 14 1 30 4 22 4 44 11-24-2-47-6-21-4-35-9-5-2 0-8Z"/>
      <ellipse cx="27" cy="21" rx="8" ry="3.4"/>
    </g>
    <g opacity=".62">
      <path d="M96 38q7-4 13-1 4 2 1 5-4 3-10 2 12 2 27 6 17 5 33 12-19-3-37-8-16-4-27-9-4-2 0-7Z"/>
      <ellipse cx="100" cy="38" rx="6.5" ry="2.8"/>
    </g>
    <g opacity=".74">
      <path d="M150 15q8-5 15-2 4 2 1 6-4 4-11 3 13 1 28 5 19 5 37 12-21-2-41-7-18-4-30-9-4-2 1-8Z"/>
      <ellipse cx="155" cy="15" rx="7.2" ry="3"/>
    </g>
    <g opacity=".55">
      <path d="M214 46q6-4 11-1 3 2 0 4-3 3-9 2 11 2 24 5 15 4 29 10-17-2-33-6-15-4-24-8-3-2 2-6Z"/>
      <ellipse cx="217" cy="46" rx="5.6" ry="2.4"/>
    </g>
    <g opacity=".68">
      <path d="M252 26q7-4 13-1 4 2 1 5-4 3-10 3 12 1 26 4 18 5 34 11-19-2-38-6-16-4-27-8-4-2 1-8Z"/>
      <ellipse cx="256" cy="26" rx="6.6" ry="2.8"/>
    </g>
    <!-- Thin secondary fibres: no head, just combing between the big streaks. -->
    <g opacity=".38">
      <path d="M60 52q26 1 52 6 24 4 44 10-24-2-48-6-25-4-48-8Z"/>
      <path d="M124 30q22 1 44 5 20 4 37 9-21-2-42-5-22-4-39-7Z"/>
      <path d="M186 60q20 1 40 5 18 3 33 8-19-2-38-5-20-3-35-6Z"/>
      <path d="M8 46q18 1 36 4 16 3 30 7-17-2-34-4-18-3-32-5Z"/>
    </g>
    <!-- The seam streak, drawn once at each end of the tile. -->
    <g opacity=".7">
      <path d="M296 34q8-5 14-2 4 2 1 6-4 3-11 3 13 1 28 5 18 4 35 11-20-2-39-6-17-4-29-9-4-2 1-8Z"/>
      <ellipse cx="300" cy="34" rx="7" ry="2.9"/>
      <g transform="translate(-320 0)">
        <path d="M296 34q8-5 14-2 4 2 1 6-4 3-11 3 13 1 28 5 18 4 35 11-20-2-39-6-17-4-29-9-4-2 1-8Z"/>
        <ellipse cx="300" cy="34" rx="7" ry="2.9"/>
      </g>
    </g>
  </g>
</svg>
