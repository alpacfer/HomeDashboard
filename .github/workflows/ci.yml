name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs are pointless and burn free minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # node-version-file keeps CI on the same version as .nvmrc, so a green
      # run here means the same version works on Ubuntu, macOS and Render.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails if package.json and package-lock.json disagree.
      - name: Install
        run: npm ci

      - name: Documentation
        run: npm run docs:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The rules from AGENTS.md that a script can check: no hover styles,
      # every lib module tested, effects paired with cleanup, and so on.
      - name: Project rules
        run: npm run check:rules

      - name: Build
        run: npm run build

      # The Fire TV Stick is the weakest link in the chain, so the client
      # bundle size is worth having in the log of every run. See
      # docs/DEPLOYMENT.md.
      - name: Report client bundle size
        run: |
          echo '### Client bundle' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh .next/static 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          find .next/static/chunks -name '*.js' -printf '%10s  %p\n' 2>/dev/null \
            | sort -rn | head -10 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # A real render of the built site, the way the Fire TV sees it.
  #
  # The screenshots are for a human to look at afterwards and cannot fail a
  # run. The two checks above them can, and that is the point of this job:
  # `npm run audit` asks the page about itself and `npm run motion` measures
  # whether an animation is smooth, and both already exit non-zero on a real
  # finding. AGENTS.md has called them mandatory since the day a flicker in the
  # forecast map shipped through a green check, a passing suite and three
  # correct-looking screenshots -- and until now neither ran anywhere
  # automatically, so the tool built in answer to that incident was still only
  # run by whoever remembered to.
  #
  # Every scene is ?weather=off or ?weather=demo, so a run never spends a
  # provider's quota. --json is captured as an artifact so a failure can be
  # read without rerunning anything.
  display:
    name: Display checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Detached, with its output redirected: a step that leaves a process
      # holding stdout does not return. Every browser tool calls waitForServer
      # before it does anything, so nothing here has to sleep.
      - name: Start the built site
        run: |
          mkdir -p screenshots
          npm start > screenshots/server.log 2>&1 &

      # Blocking. Exits 1 on an error-level finding: content clipped by an
      # ancestor, a marker wrapped onto its own line, text under the
      # legibility floor, contrast against the real backdrop.
      - name: Layout audit
        # pipefail, or the exit code would be tee's and a failing audit would
        # pass. GitHub's default shell is `bash -e`, which does not set it.
        # The script is called directly: `npm run` prints its own banner on
        # stdout first, and the artifact was not valid JSON.
        run: |
          set -o pipefail
          node scripts/audit-ui.mjs --json | tee screenshots/audit.json

      # Blocking. Exits 1 on a canvas that twitches rather than moves, which
      # is the fault a screenshot cannot show.
      - name: Animation
        run: npm run motion -- --scene map --demo

      # One browser for the four states: everything before the first --then
      # is the base, each group after it is the base plus its own flags.
      - name: Capture
        continue-on-error: true
        run: |
          npm run shot -- --offline --scene transport --out screenshots/transport.png \
            --then --scene map --demo --out screenshots/map.png \
            --then --scene fact --out screenshots/fact.png \
            --then --reduced-motion --clip .display-shell --out screenshots/clock-reduced-motion.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # Named `deps`, not `audit`. There are two audits in this repository and they
  # check unrelated things: this one reads package-lock.json, `npm run audit`
  # reads the rendered page. A job called `audit` next to a command called
  # `npm run audit` reads as though the display were being checked in CI, which
  # it was not.
  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails on high or critical advisories. If upstream publishes one with no
      # fix available, raise the level here in a commit that says why, rather
      # than letting a red run become background noise.
      - name: Audit
        run: npm audit --audit-level=high
