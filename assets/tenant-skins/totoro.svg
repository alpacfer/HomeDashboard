<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -14 120 118" width="240" height="236">
  <!-- Big Totoro, drawn for the Tenant on 4 Sep 2026 and shelved: too much
       detail for a 47 px character. Same layer and class names as
       components/tenant.tsx, so it can be pasted back in. The eye and mouth
       groups are the Tenant's original rigs, scaled: every lid, pupil and
       d:path() offset in globals.css lands proportionally.
       CSS that went with it: .t-ears origin 50px 24px; .t-tail stroke 9,
       origin 84px 82px; .t-foot origins 37px/63px 96px; .t-scarf origin
       50px 52px; .t-teeth opacity 0, shown on .g-smile and .pose-jumping. -->
  <style>
    .t-body,.t-lid,.t-ears,.t-marks,.t-foot,.t-arm-blob { fill:#6c7062; }
    .t-tail { fill:none; stroke:#6c7062; stroke-width:9; stroke-linecap:round; }
    .t-belly { fill:#dcd396; }
    .t-eye { fill:#fff; } .t-pupil,.t-nose { fill:#1a1a1f; }
    .t-lid { transform:translateY(-30px); }
    .t-mouth { fill:none; stroke:#1a1a1f; stroke-width:2.2; stroke-linecap:round; }
    .t-teeth path { fill:#fff; } .t-teeth-gaps { fill:none; stroke:#1a1a1f; stroke-width:1.4; } .t-teeth { opacity:0; }
    .t-whiskers { fill:none; stroke:#c9cbc0; stroke-width:1.8; stroke-linecap:round; opacity:.8; }
    .t-claws { fill:none; stroke:#e4e4dc; stroke-width:1.8; stroke-linecap:round; }
    .t-shades rect { fill:#15151a; } .t-shades,.t-scarf,.t-leaf,.t-grip,.t-sweat { opacity:0; }
    .t-scarf path { fill:#74caff; }
    .t-leaf-blade { fill:#5fd08a; stroke:#111113; stroke-width:2.5; stroke-linejoin:round; }
    .t-leaf-vein,.t-leaf-stem,.t-leaf-stem-outline { fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .t-leaf-vein { stroke:#111113; stroke-width:2; } .t-leaf-stem-outline { stroke:#111113; stroke-width:6.5; } .t-leaf-stem { stroke:#5fd08a; stroke-width:3.5; }
    .t-grip { fill:none; stroke:#111113; stroke-width:1.5; stroke-linecap:round; }
  </style>
  <defs>
    <clipPath id="tenant-eye-mask"><ellipse cx="30" cy="54" rx="11" ry="13" /><ellipse cx="70" cy="54" rx="11" ry="13" /></clipPath>
  </defs>
  <g class="t-figure"><g class="t-gest"><g class="t-pose">
    <path class="t-tail" d="M84 82 C92 85 98 80 95 73" />
    <g class="t-ears"><path d="M42 18 C38 5 33 -4 30 -10 C25 -1 22 12 24 27 Z" /><path d="M58 18 C62 5 67 -4 70 -10 C75 -1 78 12 76 27 Z" /></g>
    <path class="t-body" d="M50 14 C70 14 86 30 87 50 C88 62 92 74 86 84 C80 94 66 96 50 96 C34 96 20 94 14 84 C8 74 12 62 13 50 C14 30 30 14 50 14 Z" />
    <ellipse class="t-belly" cx="50" cy="74" rx="29" ry="21.5" />
    <path class="t-marks" d="M33 61.1 Q38 56.9 43 61.1 Q38 59.3 33 61.1 Z M45 61.1 Q50 56.9 55 61.1 Q50 59.3 45 61.1 Z M57 61.1 Q62 56.9 67 61.1 Q62 59.3 57 61.1 Z M27 70.1 Q32 65.9 37 70.1 Q32 68.3 27 70.1 Z M39 70.1 Q44 65.9 49 70.1 Q44 68.3 39 70.1 Z M51 70.1 Q56 65.9 61 70.1 Q56 68.3 51 70.1 Z M63 70.1 Q68 65.9 73 70.1 Q68 68.3 63 70.1 Z" />
    <g class="t-face">
      <path class="t-whiskers" d="M27 38 L1 33 M26 42 L-1 42 M27 46 L2 51 M73 38 L99 33 M74 42 L101 42 M73 46 L98 51" />
      <g transform="translate(16 3.84) scale(.68 .577)">
        <ellipse class="t-eye" cx="30" cy="54" rx="11" ry="13" /><ellipse class="t-eye" cx="70" cy="54" rx="11" ry="13" />
        <g class="t-pupils"><circle class="t-pupil" cx="31" cy="56" r="5" /><circle class="t-pupil" cx="71" cy="56" r="5" /></g>
        <g clip-path="url(#tenant-eye-mask)"><rect class="t-lid" x="18" y="40" width="24" height="28" rx="11" /><rect class="t-lid" x="58" y="40" width="24" height="28" rx="11" /></g>
        <g class="t-shades"><rect x="16" y="45" width="28" height="18" rx="5" /><rect x="56" y="45" width="28" height="18" rx="5" /><rect x="44" y="52" width="12" height="3" /></g>
      </g>
      <ellipse class="t-nose" cx="50" cy="40" rx="2.6" ry="1.7" />
      <g transform="translate(-30 0) scale(1.6 .6)">
        <g class="t-teeth"><path d="M40 74 Q50 84 60 74 Z" /><path class="t-teeth-gaps" d="M44 74 L44 79 M50 74 L50 81 M56 74 L56 79" vector-effect="non-scaling-stroke" /></g>
        <path class="t-mouth" d="M43 75 Q50 79 57 75" vector-effect="non-scaling-stroke" />
      </g>
      <ellipse class="t-sweat" cx="84" cy="24" rx="3" ry="4.5" />
    </g>
    <g class="t-scarf"><path d="M15 48 C30 60 70 60 85 48 C70 54 30 54 15 48 Z" /><path d="M72 53 L80 70 L68 66 Z" /></g>
    <g transform="translate(0 -6)"><g class="t-leaf">
      <path class="t-leaf-blade" d="M12 18 C32 -6 66 -14 97 4 C80 26 48 32 14 23 L20 19 L12 21 L18 15 Z" />
      <path class="t-leaf-vein" d="M92 5 C67 8 41 13 16 20 M68 9 L76 -1 M52 12 L59 24 M43 14 L34 4 M29 17 L23 25" />
      <path class="t-leaf-stem-outline" d="M15 18 C-4 22 -7 37 5 54 C15 68 14 86 8 101" />
      <path class="t-leaf-stem" d="M15 18 C-4 22 -7 37 5 54 C15 68 14 86 8 101" />
    </g></g>
    <g class="t-arm">
      <path class="t-arm-blob" d="M20 62 C12 59 4 64 4 71 C4 78 10 82 16 78 C20 75 21 69 20 62 Z" />
      <path class="t-claws" d="M7 80 L5 84.5 M11 81.5 L10.5 86 M15 79.5 L16.5 84" />
      <path class="t-grip" d="M8 68 L8.5 74 M11 67 L11.5 72" />
    </g>
  </g>
  <g class="t-foot"><ellipse cx="37" cy="94" rx="10" ry="5" /><path class="t-claws" d="M31 96 L29.5 100 M37 97 L37 101 M43 96 L44.5 100" /></g>
  <g class="t-foot t-foot-b"><ellipse cx="63" cy="94" rx="10" ry="5" /><path class="t-claws" d="M57 96 L55.5 100 M63 97 L63 101 M69 96 L70.5 100" /></g>
  </g></g>
</svg>
